<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>حسابك | Fast X</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--pn:#121212;--pn2:#1a1a1a;--ln:#2a2a2a;--tx:#f4f4f4;--mu:#9a9a9a;--ac:#ff1a1a;--ok:#4ade80;--am:#ffb547;--er:#ff5c5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(900px 420px at 50% -120px,#2a0707 0%,transparent 70%),var(--bg);color:var(--tx);font:16px Cairo,"Segoe UI",Tahoma,system-ui,sans-serif;padding-bottom:calc(92px + env(safe-area-inset-bottom));min-height:100vh}
.mu{color:var(--mu)}
header{position:sticky;top:0;z-index:4;background:#000e;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:2px solid var(--ac);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header img{height:42px;display:block}
.who{text-align:end;line-height:1.25}.who b{display:block;font-size:17px}.who small{color:var(--mu);font-size:12.5px}
.wrap{max-width:640px;margin:0 auto}
.hero{margin:14px 16px 0;background:linear-gradient(180deg,#1b1b1b,#101010);border:1px solid var(--ln);border-radius:20px;padding:16px 16px 14px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,transparent,var(--ac),transparent)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;padding:3px 11px;border-radius:99px;background:#ffffff12;color:var(--mu)}
.chip.on{background:#4ade8022;color:var(--ok)}.chip.off{background:#ffb54722;color:var(--am)}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.chip.on i{animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.25}}
#clk{font-size:54px;font-weight:800;text-align:center;letter-spacing:3px;direction:ltr;line-height:1.1;margin:8px 0 2px;font-variant-numeric:tabular-nums;text-shadow:0 0 28px #ff1a1a55}
.sub{text-align:center;color:var(--mu);font-size:14px}
.pr{margin-top:12px;display:none}
.pr .bar{height:9px;border-radius:9px;background:#ffffff14;overflow:hidden;direction:ltr}
.pr .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff1a1a,#ff6b3d);border-radius:9px;transition:width .6s}
.pr .tx{display:flex;justify-content:space-between;margin-top:6px;font-size:14px;gap:8px}
.pr.warn .bar i{background:var(--am)}.pr.over .bar i{background:var(--er)}
.pr.warn #left{color:var(--am)}.pr.over #left{color:var(--er)}
#left{font-weight:800;direction:ltr}
.card{margin:12px 16px 0;background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:14px}
.card h3{margin:0 0 6px;font-size:15px;color:var(--mu);font-weight:600}
.r{display:flex;justify-content:space-between;gap:8px;padding:5px 0}
.tot{border-top:1px dashed var(--ln);margin-top:8px;padding-top:10px;font-size:22px;font-weight:800}
.tot #tt{color:var(--ac)}
.sent{border-color:#4ade8055}.sent h3{color:var(--ok)}
.tabs{position:sticky;top:60px;z-index:3;display:flex;gap:8px;overflow-x:auto;padding:12px 16px 8px;background:linear-gradient(#050505ee 70%,transparent);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font:inherit;font-weight:700;color:var(--mu);background:var(--pn2);border:1px solid var(--ln);border-radius:99px;padding:7px 18px;cursor:pointer}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:4px 16px}
.it{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;color:var(--tx);min-height:104px;position:relative}
.it.has{border-color:var(--ac);background:#1a0a0a}
.it b{font-size:15.5px;line-height:1.3}
.it .pz{color:var(--mu);font-size:14px}
.it .ct{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px}
.add{font:inherit;font-weight:700;font-size:14px;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:7px 12px;cursor:pointer;width:100%}
.st{display:flex;align-items:center;gap:6px;width:100%;justify-content:space-between}
.st button{font:inherit;font-size:20px;font-weight:700;width:38px;height:38px;border-radius:10px;border:1px solid var(--ln);background:#262626;color:var(--tx);cursor:pointer;line-height:1}
.st b{font-size:18px;min-width:22px;text-align:center}
.cat{margin:18px 16px 4px;font-size:16px;color:var(--tx);font-weight:800;display:flex;align-items:center;gap:8px}
.cat:before{content:"";width:4px;height:16px;background:var(--ac);border-radius:2px}
#bar{position:fixed;inset:auto 0 0 0;background:#0b0b0bf2;border-top:2px solid var(--ac);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;z-index:6}
#bar .t{flex:1;font-weight:700}#bar .t small{display:block;color:var(--mu);font-weight:400;font-size:12.5px}
.pb{font:inherit;border:0;border-radius:12px;padding:12px 20px;font-weight:800;color:#fff;background:var(--ac);cursor:pointer;position:relative}
.pb:disabled{opacity:.5}
.pb .bd{position:absolute;top:-8px;inset-inline-start:-8px;background:#fff;color:#000;border-radius:99px;min-width:22px;height:22px;font-size:13px;display:none;align-items:center;justify-content:center;padding:0 5px}
#cart{position:fixed;inset:0;background:#000d;display:none;align-items:flex-end;justify-content:center;z-index:8}
#cart .b{background:var(--pn);width:min(600px,100%);max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-top:2px solid var(--ac)}
.ln{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.ln span{flex:1}.ln small{color:var(--mu);display:block}
.ln button{font:inherit;font-size:20px;color:var(--tx);background:#262626;border:1px solid var(--ln);border-radius:10px;width:40px;height:40px;cursor:pointer}
input{font:inherit;color:var(--tx);background:#000;border:1px solid var(--ln);border-radius:10px;padding:11px;width:100%}
#msg{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;text-align:center;font-size:22px;padding:20px;z-index:20;flex-direction:column;gap:14px}
#msg img{height:60px;margin-bottom:6px;opacity:.95}
#toast{position:fixed;inset:auto 16px 96px;z-index:30;background:#16a34a;color:#fff;border-radius:12px;padding:12px 16px;font-weight:700;text-align:center;display:none}
.ft{text-align:center;color:#555;font-size:12px;margin:22px 0 6px}
</style></head><body>

 const es=new EventSource('https://ntfy.sh/'+K+'/sse?since=12h');
 es.onmessage=ev=>{try{const m=JSON.parse(ev.data);if(m.event!='message')return;const o=JSON.parse(m.message);
  if(o.type=='state'){ST=o;ST._at=(m.time||Date.now()/1000)*1000;ENDED=false;SENT=SENT.filter(s=>s.t>ST._at)}
  else if(o.type=='menu')MN=o;else if(o.type=='ended')ENDED=true;else return;refresh()}catch(e){}}}
function elapsed(){if(!ST)return 0;return(ST.acc+(ST.start?Math.max(0,Date.now()-ST._at)+(ST._at-ST.start):0))/60000}
function tAmt(m){const k=ST.k,r=ST.r;if(ST.pre){const o=m-ST.pre;return o>0?r2(Math.ceil(o/k)*k/60*r):0}
 if(!(m>0))return 0;const sg=ST.sg||[],sm=sg.reduce((a,x)=>a+x.m,0),B=Math.max(ST.m,Math.ceil(m/k)*k);
 return r2(sg.reduce((a,x)=>a+x.m/60*x.r,0)+Math.max(0,B-sm)/60*r)}
function tick(){if(!ST)return;const m=elapsed(),s=Math.floor(m*60),cur=MN?MN.cur:'';
 $('#clk').textContent=hms(s);
 const run=!!ST.start;$('#stt').className='chip '+(run?'on':'off');$('#stx').textContent=run?'الجلسة شغّالة':'الجلسة متوقفة مؤقتاً';
 $('#rate').textContent=ST.r?'سعر الساعة: '+ST.r+' '+cur:'';
 const pr=$('#pr');
 if(ST.pre){pr.style.display='block';const left=ST.pre*60-s,pc=Math.min(100,Math.max(0,s/(ST.pre*60)*100));
  $('#pb').style.width=pc+'%';pr.className='pr'+(left<=0?' over':left<=300?' warn':'');
  $('#plab').textContent=left<=0?'عدّى الوقت المدفوع بـ':'الوقت المتبقي (مدفوع '+ST.pre+' دقيقة)';
  $('#left').textContent=hms(Math.abs(left))}
 else pr.style.display='none';
 const ta=tAmt(m),sub=ST.L.reduce((a,l)=>a+l[1]*l[2],0),d=r2((sub+ta)*(ST.pct||0)/100);
 $('#tc').textContent=(ST.pre&&!ta)?'مدفوع مقدماً ✔':ta+' '+cur;$('#tt').textContent=Math.max(0,r2(sub+ta-d))+' '+cur}
setInterval(tick,1000);
function refresh(){
 if(ENDED){say('انتهت الجلسة ✅<br><small class="mu">شكراً لزيارتكم - نتمنى نشوفكم تاني في Fast X</small>');return}
 if(!ST||!MN)return;$('#msg').style.display='none';
 $('#sn').textContent=ST.n;$('#shop').textContent=MN.shop;
 $('#items').innerHTML=ST.L.map(l=>'<div class="r"><span>'+l[2]+' × '+esc(l[0])+'</span><span>'+r2(l[1]*l[2])+' '+esc(MN.cur)+'</span></div>').join('')+(ST.pct?'<div class="r" style="color:var(--ok)"><span>خصم '+ST.pct+'%</span></div>':'');
 $('#sent').innerHTML=SENT.length?'<div class="card sent"><h3>✔ طلباتك وصلت للكاشير وقيد التحضير</h3>'+SENT.map(s=>s.l.map(l=>'<div>'+l.q+' × '+esc(l.n)+'</div>').join('')).join('<hr style="border-color:#2c2c2c">')+'</div>':'';
 draw();tick()}
function cats(){const o=[];MN.items.forEach(x=>{if(o.indexOf(x[2])<0)o.push(x[2])});return o}
function draw(){
 if(!MN)return;const cs=cats();if(TAB!='all'&&cs.indexOf(TAB)<0)TAB='all';
 $('#tabs').innerHTML=cs.length>1?[['all','الكل']].concat(cs.map(c=>[c,CATS[c]||c])).map(([k,t])=>'<button class="tab'+(TAB==k?' on':'')+'" onclick="TAB=\''+k.replace(/'/g,'')+'\';draw()">'+esc(t)+'</button>').join(''):'';
 $('#tabs').style.display=cs.length>1?'flex':'none';
 $('#m').innerHTML=cs.filter(c=>TAB=='all'||TAB==c).map(c=>{const l=MN.items.map((x,i)=>[x,i]).filter(a=>a[0][2]==c);
  return '<div class="cat">'+esc(CATS[c]||c)+'</div><div class="g">'+l.map(([x,i])=>'<div class="it'+(C[i]?' has':'')+'"><b>'+esc(x[0])+'</b><span class="pz">'+x[1]+' '+esc(MN.cur)+'</span><div class="ct">'+(C[i]?'<div class="st"><button onclick="add('+i+')">+</button><b>'+C[i]+'</b><button ">−</button></div>':'<button class="add" onclick="add('+i+')">+ إضافة</button>')+'</div></div>').join('')+'</div>'}).join('');
 const q=Object.values(C).reduce((a,b)=>a+b,0),t=r2(Object.entries(C).reduce((a,[i,n])=>a+MN.items[i][1]*n,0));
 $('#sum').textContent=q?q+' صنف - '+t+' '+MN.cur:'اختار من المنيو';$('#sum2').textContent=q?'اضغط السلة لإرسال الطلب':'';
 const bd=$('#bd');bd.textContent=q;bd.style.display=q?'flex':'none'}
function add(i){C[i]=(C[i]||0)+1;draw();if($('#cart').style.display=='flex')renderCart()}
function dec(i){if(--C[i]<=0)delete C[i];draw();if($('#cart').style.display=='flex')renderCart()}
function renderCart(){const e=Object.entries(C);
 if(!e.length){$('#cart').style.display='none';return}
 $('#cl').innerHTML=e.map(([i,n])=>'<div class="ln"><span>'+esc(MN.items[i][0])+'<small>'+MN.items[i][1]+' '+esc(MN.cur)+'</small></span><button onclick="dec('+i+')">−</button><b>'+n+'</b><button onclick="add('+i+')">+</button></div>').join('');
 $('#ct').textContent=r2(e.reduce((a,[i,n])=>a+MN.items[i][1]*n,0))+' '+MN.cur;$('#send').disabled=false;$('#cart').style.display='flex'}
function openCart(){if(!MN)return;if(!Object.keys(C).length)return toast('السلة فاضية - اختار حاجة من المنيو');renderCart()}
async function sendO(){const e=Object.entries(C);if(!e.length||!K)return;
 const lines=e.map(([i,n])=>({n:MN.items[i][0],c:MN.items[i][2],q:n}));
 const o={type:'order',id:Date.now()+''+Math.floor(Math.random()*1e4),ts:Date.now(),note:$('#nt').value.trim(),lines};
 const b=$('#send');b.disabled=true;b.textContent='...';
 try{const r=await fetch('https://ntfy.sh/'+K,{method:'POST',body:JSON.stringify(o)});if(!r.ok)throw 0;
  SENT.push({t:Date.now(),l:lines});setTimeout(()=>{SENT=SENT.filter(s=>Date.now()-s.t<3e5);refresh()},3e5);
  C={};$('#nt').value='';$('#cart').style.display='none';refresh();toast('تم إرسال طلبك للكاشير ✔')}
 catch(x){alert('تعذر إرسال الطلب، تأكد من الإنترنت وحاول تاني')}
 b.disabled=false;b.textContent='إرسال الطلب للكاشير'}
</script></body></html>
