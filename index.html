<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>حسابك</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#000;--pn:#141414;--ln:#2c2c2c;--tx:#f4f4f4;--mu:#9a9a9a;--ac:#ff1a1a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px "Segoe UI",Tahoma,system-ui,sans-serif;padding-bottom:84px}
header{padding:12px 16px;border-bottom:2px solid var(--ac);display:flex;justify-content:space-between;gap:8px}
header b{font-size:18px}.mu{color:var(--mu)}
.bill{margin:12px 16px;background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:14px}
#clk{font-size:42px;font-weight:800;text-align:center;letter-spacing:2px;direction:ltr}
.r{display:flex;justify-content:space-between;gap:8px;padding:4px 0}
.tot{border-top:1px solid var(--ln);margin-top:6px;padding-top:8px;font-size:20px;font-weight:800}
h2{font-size:17px;color:var(--mu);margin:16px 16px 8px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:0 16px}
.it{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;color:var(--tx);font:inherit;text-align:start}
.it:active{border-color:var(--ac)}.it span{color:var(--mu)}
.it .n{align-self:flex-end;background:var(--ac);color:#fff;border-radius:12px;padding:0 9px;font-weight:700}
#bar{position:fixed;inset:auto 0 0 0;background:#0d0d0d;border-top:2px solid var(--ac);padding:10px 14px;display:flex;gap:10px;align-items:center}
#bar button,.pb{font:inherit;border:0;border-radius:10px;padding:12px 18px;font-weight:700;color:#fff;background:var(--ac);cursor:pointer}
#bar .t{flex:1}
#cart{position:fixed;inset:0;background:#000d;display:none;align-items:flex-end;justify-content:center;z-index:5}
#cart .b{background:var(--pn);width:min(560px,100%);max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.ln{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
.ln span{flex:1}.ln button{font:inherit;color:var(--tx);background:#222;border:1px solid var(--ln);border-radius:8px;width:38px;height:38px;cursor:pointer}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:10px;width:100%}
#msg{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;text-align:center;font-size:22px;padding:20px;z-index:9;flex-direction:column;gap:14px}
</style></head><body>
<header><b id="sn">...</b><span class="mu" id="shop"></span></header>
<div class="bill"><div id="clk">00:00:00</div>
<div class="r mu"><span>حساب الوقت</span><b id="tc">-</b></div>
<div id="items"></div>
<div class="r tot"><span>الإجمالي</span><span id="tt">-</span></div></div>
<div id="sent"></div>
<div id="m"></div>
<div id="bar"><div class="t" id="sum">اختار من المنيو</div><button onclick="openCart()">السلة</button></div>
<div id="cart" onclick="if(event.target==this)this.style.display='none'"><div class="b"><h3 style="margin:0 0 8px">طلبك</h3><div id="cl"></div>
<input id="nt" maxlength="150" placeholder="ملاحظات (اختياري)" style="margin:12px 0">
<div style="display:flex;gap:8px"><button class="pb" id="send" onclick="sendO()" style="flex:1">إرسال الطلب</button><button class="pb" style="background:#222" onclick="document.getElementById('cart').style.display='none'">رجوع</button></div></div></div>
<div id="msg"><div id="mt"></div></div>
<script>
const $=s=>document.querySelector(s),r2=n=>Math.round(n*100)/100;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K=(location.hash.match(/k=([A-Za-z0-9]+)/)||[])[1];
let ST=null,MN=null,ENDED=false,C={},SENT=[];
function say(t){$('#mt').innerHTML=t;$('#msg').style.display='flex'}
if(!K)say('الرابط غير صحيح.<br><small class="mu">امسح الـ QR من الإيصال تاني</small>');
else{say('جاري التحميل...');
 const es=new EventSource('https://ntfy.sh/'+K+'/sse?since=12h');
 es.onmessage=ev=>{try{const m=JSON.parse(ev.data);if(m.event!='message')return;const o=JSON.parse(m.message);
  if(o.type=='state'){ST=o;ST._at=(m.time||Date.now()/1000)*1000;ENDED=false;SENT=SENT.filter(s=>s.t>ST._at)}
  else if(o.type=='menu')MN=o;else if(o.type=='ended')ENDED=true;else return;refresh()}catch(e){}}}
function elapsed(){if(!ST)return 0;return(ST.acc+(ST.start?Math.max(0,Date.now()-ST._at)+(ST._at-ST.start):0))/60000}
function tAmt(m){const k=ST.k,r=ST.r;if(ST.pre){const o=m-ST.pre;return o>0?r2(Math.ceil(o/k)*k/60*r):0}
 if(!(m>0))return 0;const sg=ST.sg||[],sm=sg.reduce((a,x)=>a+x.m,0),B=Math.max(ST.m,Math.ceil(m/k)*k);
 return r2(sg.reduce((a,x)=>a+x.m/60*x.r,0)+Math.max(0,B-sm)/60*r)}
function tick(){if(!ST)return;const m=elapsed(),s=Math.floor(m*60),p=n=>String(n).padStart(2,'0');
 $('#clk').textContent=p(s/3600|0)+':'+p(s/60%60|0)+':'+p(s%60);
 const ta=tAmt(m),sub=ST.L.reduce((a,l)=>a+l[1]*l[2],0),d=r2((sub+ta)*(ST.pct||0)/100);
 $('#tc').textContent=ta+' '+(MN?MN.cur:'');$('#tt').textContent=Math.max(0,r2(sub+ta-d))+' '+(MN?MN.cur:'')}
setInterval(tick,1000);
function refresh(){
 if(ENDED){say('انتهت الجلسة ✅<br><small class="mu">شكراً لزيارتكم</small>');return}
 if(!ST||!MN)return;$('#msg').style.display='none';
 $('#sn').textContent=ST.n;$('#shop').textContent=MN.shop;
 $('#items').innerHTML=ST.L.map(l=>'<div class="r"><span>'+l[2]+' × '+esc(l[0])+'</span><span>'+r2(l[1]*l[2])+'</span></div>').join('')+(ST.pct?'<div class="r mu"><span>خصم '+ST.pct+'%</span></div>':'');
 $('#sent').innerHTML=SENT.length?'<h2>طلباتك في انتظار الكاشير</h2><div class="bill">'+SENT.map(s=>s.l.map(l=>'<div>'+l.q+' × '+esc(l.n)+'</div>').join('')).join('<hr style="border-color:#2c2c2c">')+'</div>':'';
 draw();tick()}
function draw(){
 if(!MN)return;
 $('#m').innerHTML=[['Cafe','المشروبات'],['Restaurant','الأطعمة']].map(([c,t])=>{const l=MN.items.map((x,i)=>[x,i]).filter(a=>a[0][2]==c);
  return l.length?'<h2>'+t+'</h2><div class="g">'+l.map(([x,i])=>'<button class="it" onclick="add('+i+')"><b>'+esc(x[0])+'</b><span>'+x[1]+' '+esc(MN.cur)+'</span>'+(C[i]?'<div class="n">'+C[i]+'</div>':'')+'</button>').join('')+'</div>':''}).join('');
 const q=Object.values(C).reduce((a,b)=>a+b,0),t=Object.entries(C).reduce((a,[i,n])=>a+MN.items[i][1]*n,0);
 $('#sum').textContent=q?q+' صنف - '+t+' '+MN.cur:'اختار من المنيو'}
function add(i){C[i]=(C[i]||0)+1;draw()}
function dec(i){if(--C[i]<=0)delete C[i];draw();openCart()}
function openCart(){const e=Object.entries(C);
 $('#cl').innerHTML=e.length?e.map(([i,n])=>'<div class="ln"><span>'+esc(MN.items[i][0])+'</span><button onclick="dec('+i+')">−</button><b>'+n+'</b><button onclick="add('+i+');openCart()">+</button></div>').join(''):'<p class="mu">السلة فاضية</p>';
 $('#cart').style.display='flex'}
async function sendO(){const e=Object.entries(C);if(!e.length||!K)return;
 const lines=e.map(([i,n])=>({n:MN.items[i][0],c:MN.items[i][2],q:n}));
 const o={type:'order',id:Date.now()+''+Math.floor(Math.random()*1e4),ts:Date.now(),note:$('#nt').value.trim(),lines};
 const b=$('#send');b.disabled=true;b.textContent='...';
 try{const r=await fetch('https://ntfy.sh/'+K,{method:'POST',body:JSON.stringify(o)});if(!r.ok)throw 0;
  SENT.push({t:Date.now(),l:lines});setTimeout(()=>{SENT=SENT.filter(s=>Date.now()-s.t<3e5);refresh()},3e5);
  C={};$('#nt').value='';$('#cart').style.display='none';refresh()}
 catch(x){alert('تعذر إرسال الطلب، تأكد من الإنترنت وحاول تاني')}
 b.disabled=false;b.textContent='إرسال الطلب'}
</script></body></html>
